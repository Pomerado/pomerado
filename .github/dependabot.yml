# Workflows pin every action to a commit SHA (tools/check-workflows.ts). Dependabot moves those pins,
# and the version comments beside them, to each new release, in one weekly pull request.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
  # Security updates only: a pull request opens for a vulnerable dependency, and the limit of 0
  # silences routine version updates.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
