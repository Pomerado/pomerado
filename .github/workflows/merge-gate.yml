# Required check `Merge gate`: the hold label and the freeze switch for the merge queue.
#
# - `merge-hold` on a pull request keeps it out of the queue, and fails its merge group if it is
#   already queued.
# - `merge-freeze` on any open issue stops every merge group. Only maintainers can label issues.
#
# In a merge group the gate checks both labels, waits for that group's `CI` to finish, and checks
# them again, so a hold or freeze set while CI runs still stops the merge.
#
# It lives apart from check.yml so a label change reruns only this check, never the test suite.
name: Merge gate
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  merge_group:
permissions: {}
concurrency:
  group: merge-gate-${{ github.event.pull_request.number || github.event.merge_group.head_ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  gate:
    name: Merge gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      checks: read
      issues: read
      pull-requests: read
    steps:
      - name: Check merge-hold and merge-freeze
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.merge_group.head_ref }}
          HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          POLL_SECONDS: 20
          WAIT_SECONDS: 3300
        run: |
          # GitHub Actions' App ID: only its `CI` check counts.
          actions_app=15368

          # Prints true or false. A failed read stops the script, so the gate fails closed.
          held() {
            gh api "repos/$REPO/pulls/$1" --jq '[.labels[].name] | index("merge-hold") != null'
          }
          frozen() {
            gh api "repos/$REPO/issues?state=open&labels=merge-freeze&per_page=1" --jq 'length > 0'
          }
          check_hold() {
            local value
            value=$(held "$1")
            if [ "$value" != false ]; then
              echo "::error::#$1 carries merge-hold. Remove the label to let it merge."
              exit 1
            fi
          }
          check_freeze() {
            local value
            value=$(frozen)
            if [ "$value" != false ]; then
              echo "::error::Merges are frozen: an open issue carries merge-freeze."
              exit 1
            fi
          }

          case $EVENT in
            pull_request)
              check_hold "$PR_NUMBER"
              echo "#$PR_NUMBER has no merge-hold."
              ;;
            merge_group)
              # GitHub names the group's branch gh-readonly-queue/<base>/pr-<number>-<head sha>.
              if [[ ! $HEAD_REF =~ /pr-([0-9]+)-[0-9a-f]{40}$ ]]; then
                echo "::error::Can't read the pull request from $HEAD_REF."
                exit 1
              fi
              pr=${BASH_REMATCH[1]}
              check_freeze
              check_hold "$pr"

              deadline=$((SECONDS + WAIT_SECONDS))
              while :; do
                ci=$(gh api "repos/$REPO/commits/$HEAD_SHA/check-runs?check_name=CI&filter=latest" \
                  --jq "[.check_runs[] | select(.app.id == $actions_app)] | first
                    | if . == null then \"missing\" else \"\(.status) \(.conclusion // \"\")\" end")
                case $ci in completed*) break ;; esac
                if [ "$SECONDS" -ge "$deadline" ]; then
                  echo "::error::CI didn't finish on $HEAD_SHA in time (last seen: $ci)."
                  exit 1
                fi
                sleep "$POLL_SECONDS"
              done
              # A red CI fails the group by itself; the gate only adds the hold and the freeze.
              echo "CI on $HEAD_SHA: $ci"
              check_freeze
              check_hold "$pr"
              echo "#$pr has no merge-hold, and merges aren't frozen."
              ;;
            *)
              echo "::error::Unexpected event $EVENT."
              exit 1
              ;;
          esac
