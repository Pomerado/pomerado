# Builds the test map that test selection reads (tools/test-map.ts). It runs each test file alone
# with tools/test-map-trace.ts preloaded into every Node process and records which repository files
# the test loaded, read or listed. The map is uploaded as the artifact `test-map` for 14 days.
#
# Maps come only from main, in this repository, by a schedule or a maintainer's dispatch. A pull
# request never builds one and only reads the newest map from a successful run here, so nothing a
# pull request contains can change what a map says. A map run never gates anything. It runs once a
# day, since a map costs about two full runs of the suite and changes slowly. The repository
# variable TEST_SELECTION_DISABLED=true stops it.
#
# Standard GitHub-hosted runners have 4 vCPUs for a public repository, like the check job's.
name: Test map
on:
  schedule:
    - cron: "17 10 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: test-map
  cancel-in-progress: false
jobs:
  unit:
    if: github.repository == 'Pomerado/pomerado' && github.ref == 'refs/heads/main' && vars.TEST_SELECTION_DISABLED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.22.1
          package-manager-cache: false
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm build
      # Each test file runs in its own Vitest run, four at a time.
      - run: node tools/test-map.ts run --suite unit --parallel 4 --out "$RUNNER_TEMP/unit.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-map-unit
          path: ${{ runner.temp }}/unit.json
          retention-days: 3
  browser:
    if: github.repository == 'Pomerado/pomerado' && github.ref == 'refs/heads/main' && vars.TEST_SELECTION_DISABLED != 'true'
    name: browser (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.22.1
          package-manager-cache: false
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm build
      - run: corepack pnpm exec playwright install --with-deps chromium
      # Each spec file runs in its own Playwright run with one worker per vCPU.
      - run: >-
          node tools/test-map.ts run --suite browser --workers 4
          --shard ${{ matrix.shard }}/${{ strategy.job-total }} --out "$RUNNER_TEMP/browser.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-map-browser-${{ matrix.shard }}
          path: ${{ runner.temp }}/browser.json
          retention-days: 3
  # Merges the shards' records into one map. A test file whose run failed is listed as failed, and
  # selection always runs it, so a red test never makes the map miss what it would have read.
  map:
    needs: [unit, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.22.1
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: test-map-*
          path: ${{ runner.temp }}/partials
      - run: node tools/test-map.ts merge --sha "$GITHUB_SHA" --out "$RUNNER_TEMP/test-map.json" "$RUNNER_TEMP"/partials/*/*.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-map
          path: ${{ runner.temp }}/test-map.json
          retention-days: 14
