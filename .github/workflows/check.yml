name: Check
on:
  # Only main: pull requests run below, so other pushes would only run the same commit twice.
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  # Secret scan with gitleaks and .gitleaks.toml. A pull request scans each of its commits, so a
  # secret added and then removed still fails. Every other event scans the checked-out tree, and a
  # push to main also scans each pushed commit.
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks pinned by SHA-256
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -fsSL --retry 3 -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
      # A pull request scans its commits. A push to main scans the pushed commits, unless a force
      # push left no earlier commit to start from. Other events scan no commits.
      - name: Find the commits to scan
        id: range
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          commits=""
          if [ "$EVENT" = pull_request ]; then
            commits="$PR_BASE..$PR_HEAD"
          elif [ "$EVENT" = push ] && git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
            commits="$PUSH_BEFORE..$PUSH_AFTER"
          elif [ "$EVENT" = push ]; then
            echo "::warning::No earlier commit to start from. Only the tree is scanned."
          fi
          echo "commits=$commits" >> "$GITHUB_OUTPUT"
      - name: Scan for secrets
        env:
          EVENT: ${{ github.event_name }}
          COMMITS: ${{ steps.range.outputs.commits }}
        run: |
          if [ -n "$COMMITS" ]; then
            "$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --redact --no-banner \
              --log-opts="$COMMITS" .
          fi
          if [ "$EVENT" != pull_request ]; then
            "$RUNNER_TEMP/gitleaks" dir --config .gitleaks.toml --redact --no-banner .
          fi
  # Generic scan for internal hostnames, account IDs, ticket and review references and secret
  # file names. It always scans every tracked file, and the messages of a pull request's commits or
  # of the commits pushed to main.
  content-scan:
    name: Public content scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.21.0
      # A pull request scans its commits. A push to main scans the pushed commits, unless a force
      # push left no earlier commit to start from. Other events scan no commits.
      - name: Find the commits to scan
        id: range
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          commits=""
          if [ "$EVENT" = pull_request ]; then
            commits="$PR_BASE..$PR_HEAD"
          elif [ "$EVENT" = push ] && git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
            commits="$PUSH_BEFORE..$PUSH_AFTER"
          elif [ "$EVENT" = push ]; then
            echo "::warning::No earlier commit to start from. Only the tree is scanned."
          fi
          echo "commits=$commits" >> "$GITHUB_OUTPUT"
      - name: Scan public content
        env:
          COMMITS: ${{ steps.range.outputs.commits }}
        run: |
          if [ -n "$COMMITS" ]; then
            node tools/check-public-content.ts --commits "$COMMITS"
          else
            node tools/check-public-content.ts
          fi
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm typecheck
      - run: corepack pnpm build
      - run: corepack pnpm test
      - name: Validate packed package outside the checkout
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/pomerado-artifact" "$RUNNER_TEMP/pomerado-consumer"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/pomerado-artifact"
          cd "$RUNNER_TEMP/pomerado-consumer"
          npm init -y
          npm install --ignore-scripts "$RUNNER_TEMP/pomerado-artifact/"*.tgz @types/node@24.13.4 vitest@5.0.2
          node --input-type=module <<'JS'
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          import { createRequire } from "node:module";
          import * as runtime from "pomerado/runtime";
          import * as errors from "pomerado/core/runtime/errors";
          import { getAuthoringDirectory, getGuardianPolicyPath } from "pomerado/assets";
          const require = createRequire(import.meta.url);
          const manifest = require("pomerado/package.json");
          const packageRequire = createRequire(require.resolve("pomerado/package.json"));
          for (const dependency of ["effect", "@openai/agents"]) {
            assert.equal(packageRequire.resolve(dependency), require.resolve(dependency));
          }
          for (const key of Object.keys(manifest.exports).filter((key) => key.startsWith("./core/"))) {
            await import(`pomerado/${key.slice(2)}`);
          }
          assert.equal(runtime.BrowserFailure, errors.BrowserFailure);
          assert.ok(readFileSync(getGuardianPolicyPath(), "utf8").includes("{{ tenant_policy_config }}"));
          assert.ok(readFileSync(`${getAuthoringDirectory()}/workspace/AGENTS.md`, "utf8").length > 0);
          JS
          cat > consumer.mts <<'TS'
          import { MintServices } from "pomerado/core/mint/contracts";
          import type { MintDependencies } from "pomerado/core/mint/contracts";
          import { runMint } from "pomerado/core/mint/harness";
          import type { HostExecute } from "pomerado/core/runtime/host-execute";
          import { getAuthoringDirectory } from "pomerado/assets";
          import { expectFailure } from "pomerado/testing/expect-failure";
          declare const dependencies: MintDependencies;
          declare const execute: HostExecute;
          MintServices.of(dependencies);
          execute("return 1");
          runMint({});
          getAuthoringDirectory();
          void expectFailure;
          TS
          "$GITHUB_WORKSPACE/node_modules/.bin/tsc" --noEmit --strict --skipLibCheck --target ES2024 --module NodeNext --moduleResolution NodeNext consumer.mts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pomerado-package
          path: ${{ runner.temp }}/pomerado-artifact/*.tgz
      - run: corepack pnpm exec playwright install --with-deps chromium
      - run: corepack pnpm test:browser --workers=2
  # `CI` is one status for the whole run. It fails unless every job it needs succeeded, so a
  # skipped or cancelled job never passes for a green one. Add every new job to `needs`.
  ci:
    name: CI
    if: always()
    needs: [check, secret-scan, content-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          failed=$(jq -r 'to_entries[] | select(.value.result != "success") | "\(.key): \(.value.result)"' <<<"$NEEDS")
          if [ -n "$failed" ]; then
            echo "::error::Jobs that didn't succeed: ${failed//$'\n'/, }"
            exit 1
          fi
          echo "Every job succeeded."
