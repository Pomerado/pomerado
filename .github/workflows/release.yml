# Every npm release of pomerado comes from this workflow, with npm provenance. docs/RELEASING.md
# describes the process. Two events start it:
# - A push to main publishes a canary, X.Y.Z-canary.N under the `canary` dist-tag, from the exact
#   tarball the Check workflow tested. N is this workflow's run number, so canaries only grow.
# - A dispatch on main with a version and its integrity promotes that published version to the
#   `latest` dist-tag, then tags its commit and creates the GitHub Release. Pomerado's production
#   deploy dispatches it for the version production runs, and again on a rollback, so `latest`
#   follows production. Promoting the version `latest` already names changes nothing on npm.
# Publish and promote run on GitHub-hosted runners in the npm-release environment, which npm
# trusted publishing names: npm swaps the job's short lived OIDC token for rights to this package
# alone, and --provenance needs a GitHub-hosted runner. GitHub stores no npm token. No tag starts
# this workflow, and both jobs run only on main.
name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Published version to promote to latest, such as 0.2.1-canary.57
        required: true
        type: string
      integrity:
        description: The version's sha512 integrity, as a lockfile records it
        required: true
        type: string
permissions:
  contents: read
# One canary at a time, in push order. A newer push replaces a canary still waiting to start, and
# the newest canary includes its commits. So a replaced push gets no Check run of its own on main.
# Its pull request ran Check on the pull request's own tree, which can differ from the merged tree on
# main. So the Check this workflow runs on a push to main is what validates the merged tree.
# Promotions queue apart from canaries the same way.
concurrency:
  group: release-${{ github.event_name }}
  cancel-in-progress: false
jobs:
  version:
    if: github.event_name == 'push' && github.repository == 'Pomerado/pomerado'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.22.1
          package-manager-cache: false
      # A canary precedes the next release in semver order. package.json names that release until
      # it is published, and after that the canary takes the next patch version. A re-run of this
      # run after its canary published finds the version on npm and skips Check and publish.
      - name: Choose the canary version
        id: version
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          base="$(node -p 'require("./package.json").version')"
          # Semver forbids leading zeros, so 01.2.3 is refused, not read as 1.2.3.
          if ! [[ "$base" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::package.json version $base is not a plain X.Y.Z release version."
            exit 1
          fi
          major="${BASH_REMATCH[1]}" minor="${BASH_REMATCH[2]}" patch="${BASH_REMATCH[3]}"
          # A failed read stops the job. Treating it as unpublished would make a canary that
          # sorts below the release npm already has. npm prints a lone version as a string.
          published="$(npm view pomerado versions --json)"
          published="$(jq -c 'if type == "array" then . else [.] end' <<<"$published")"
          if jq -e --arg v "$base" 'index($v) != null' <<<"$published" >/dev/null; then
            base="$major.$minor.$((patch + 1))"
          fi
          version="$base-canary.$RUN_NUMBER"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Run numbers never repeat, so only a re-run of this run finds its version on npm.
          if jq -e --arg v "$version" 'index($v) != null' <<<"$published" >/dev/null; then
            echo "pomerado@$version is already published. Nothing to publish." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Canary version: $version"
          echo "publish=true" >> "$GITHUB_OUTPUT"
  check:
    needs: version
    if: needs.version.outputs.publish == 'true'
    uses: ./.github/workflows/check.yml
    # Check's browser plan reads the test durations earlier Release runs recorded.
    permissions:
      contents: read
      actions: read
    with:
      version: ${{ needs.version.outputs.version }}
  canary:
    needs: [version, check]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: bash
    steps:
      # No registry URL input, so setup-node writes no .npmrc token placeholder.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.22.1
          package-manager-cache: false
      # By the ID the check job recorded, not by name, so no other job of the run can swap the
      # artifact for its own.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.check.outputs.package-artifact-id }}
          path: package-artifact
      - name: Verify the tested tarball
        id: tarball
        env:
          VERSION: ${{ needs.version.outputs.version }}
          SHA256: ${{ needs.check.outputs.package-sha256 }}
        run: |
          shopt -s nullglob
          tarballs=(package-artifact/*.tgz)
          if [ "${#tarballs[@]}" -ne 1 ]; then
            echo "::error::Expected one tarball in package-artifact. Found ${#tarballs[@]}."
            exit 1
          fi
          # Keep the ./ prefix. npm reads dir/file.tgz as a GitHub owner/repo.
          tarball="./${tarballs[0]}"
          # The bytes the check job built and tested, and no others.
          if ! [[ "$SHA256" =~ ^[0-9a-f]{64}$ ]] || ! echo "$SHA256  $tarball" | sha256sum --check --strict --quiet; then
            echo "::error::The tarball isn't the one the check job built: its SHA-256 doesn't match ${SHA256:-(none)}."
            exit 1
          fi
          manifest="$(tar -xzOf "$tarball" package/package.json)"
          name="$(jq -r .name <<<"$manifest")"
          version="$(jq -r .version <<<"$manifest")"
          if [ "$name" != "pomerado" ] || [ "$version" != "$VERSION" ]; then
            echo "::error::Tarball holds $name@$version. Expected pomerado@$VERSION."
            exit 1
          fi
          echo "path=$tarball" >> "$GITHUB_OUTPUT"
      # Checked here, just before publishing, so that re-running this job alone is safe too. A
      # re-run after the publish finds these bytes on npm and stops. Otherwise the canary must sort
      # above every version npm has, so `canary` never moves backwards, whether package.json's
      # version went down or an older run's job is re-run after a newer canary.
      - name: Publish the canary with npm trusted publishing and provenance
        env:
          TARBALL: ${{ steps.tarball.outputs.path }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          published="$(npm view pomerado versions --json)"
          published="$(jq -c 'if type == "array" then . else [.] end' <<<"$published")"
          if jq -e --arg v "$VERSION" 'index($v) != null' <<<"$published" >/dev/null; then
            integrity="sha512-$(openssl dgst -sha512 -binary "$TARBALL" | base64 -w0)"
            if [ "$(npm view "pomerado@$VERSION" dist.integrity)" != "$integrity" ]; then
              echo "::error::npm already has a different pomerado@$VERSION."
              exit 1
            fi
            echo "pomerado@$VERSION is already published." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Compare with the semver package npm itself ships, so the order is npm's.
          npm_dir="$(dirname "$(readlink -f "$(command -v npm)")")/.."
          SEMVER="$npm_dir/node_modules/semver" PUBLISHED="$published" node <<'JS'
          const semver = require(process.env.SEMVER);
          const [highest] = semver.rsort(JSON.parse(process.env.PUBLISHED));
          if (highest && !semver.gt(process.env.VERSION, highest)) {
            console.log(`::error::pomerado@${process.env.VERSION} doesn't sort above ${highest}, the highest version npm has.`);
            process.exit(1);
          }
          JS
          npm publish "$TARBALL" --provenance --access public --tag canary
          echo "Published pomerado@$VERSION under canary." >> "$GITHUB_STEP_SUMMARY"
  promote:
    if: >-
      github.event_name == 'workflow_dispatch' && github.repository == 'Pomerado/pomerado'
      && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm-release
    # The workflow token only reads. The tag and the GitHub Release use a release app token, which
    # the job mints just before the tag step.
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ inputs.version }}
      INTEGRITY: ${{ inputs.integrity }}
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
    steps:
      # Check the release app's configuration before anything writes, so a promotion doesn't move
      # latest and then fail to tag.
      - name: Check the release app configuration
        env:
          APP_ID: ${{ vars.RELEASE_APP_ID }}
          HAS_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY != '' }}
        run: |
          if [ -z "$APP_ID" ] || [ "$HAS_PRIVATE_KEY" != true ]; then
            echo "::error::The npm-release environment needs the RELEASE_APP_ID variable and the RELEASE_APP_PRIVATE_KEY secret of the release GitHub App, which creates release tags. docs/RELEASING.md describes the setup."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.22.1
          package-manager-cache: false
      # The integrity is the one the deploy pinned and tested, so latest moves to exactly those
      # bytes. npm records no gitHead for a package published from a tarball, so the commit comes
      # from the version's SLSA provenance. It must cover these bytes under this name, come from
      # release.yml in this repository on a GitHub-hosted runner, and name a commit on main.
      # Canaries are built from refs/heads/main. Releases from the retired tag workflow, 0.2.0 and
      # earlier, were built from their own v<version> tag, so a rollback can still return to one.
      - name: Verify the published version
        id: published
        run: |
          if ! [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-canary\.(0|[1-9][0-9]*))?$ ]]; then
            echo "::error::The version is not a release or canary version."
            exit 1
          fi
          if ! [[ "$INTEGRITY" =~ ^sha512-[A-Za-z0-9+/]+=*$ ]]; then
            echo "::error::The integrity must be one sha512 SRI value."
            exit 1
          fi
          metadata="$(npm view "pomerado@$VERSION" --json)"
          published_version="$(jq -r .version <<<"$metadata")"
          published_integrity="$(jq -r .dist.integrity <<<"$metadata")"
          attestations="$(jq -r '.dist.attestations.url // empty' <<<"$metadata")"
          if [ "$published_version" != "$VERSION" ]; then
            echo "::error::npm has no pomerado@$VERSION."
            exit 1
          fi
          if [ "$published_integrity" != "$INTEGRITY" ]; then
            echo "::error::pomerado@$VERSION has integrity $published_integrity, not the deployed $INTEGRITY."
            exit 1
          fi
          if [ -z "$attestations" ]; then
            echo "::error::pomerado@$VERSION has no provenance."
            exit 1
          fi
          statement="$(curl -fsS --retry 3 "$attestations" |
            jq -er '[.attestations[] | select(.predicateType == "https://slsa.dev/provenance/v1")] | first | .bundle.dsseEnvelope.payload' |
            base64 -d)"
          digest="$(base64 -d <<<"${INTEGRITY#sha512-}" | od -An -v -tx1 | tr -d ' \n')"
          release=false
          if [[ "$VERSION" != *-* ]]; then
            release=true
          fi
          commit="$(jq -r --arg digest "$digest" --arg name "pkg:npm/pomerado@$VERSION" \
            --arg tag "refs/tags/v$VERSION" --argjson release "$release" '
            .predicate.buildDefinition.externalParameters.workflow as $workflow
            | select(.subject[0].name == $name
              and .subject[0].digest.sha512 == $digest
              and $workflow.repository == "https://github.com/Pomerado/pomerado"
              and $workflow.path == ".github/workflows/release.yml"
              and ($workflow.ref == "refs/heads/main" or ($release and $workflow.ref == $tag))
              and .predicate.runDetails.builder.id == "https://github.com/actions/runner/github-hosted")
            | .predicate.buildDefinition.resolvedDependencies[0].digest.gitCommit // empty' <<<"$statement")"
          if [ -z "$commit" ]; then
            echo "::error::pomerado@$VERSION's provenance doesn't show these bytes built by release.yml on main of this repository, on a GitHub-hosted runner."
            jq -c '{subject: .subject[0].name, workflow: .predicate.buildDefinition.externalParameters.workflow, builder: .predicate.runDetails.builder.id}' <<<"$statement"
            exit 1
          fi
          # Only a full lowercase commit hash reaches git and the GitHub API.
          if ! [[ "$commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::pomerado@$VERSION's provenance doesn't name a full commit hash."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$commit" origin/main; then
            echo "::error::pomerado@$VERSION was built from $commit, which is not on main."
            exit 1
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      # npm dist-tag authenticates through trusted publishing (OIDC) from npm 11.21.0. Node 24.22.1
      # ships npm 11.19.1, whose dist-tag never asks for an OIDC token and so has no credentials.
      # This step alone runs npm 11.21.0. Keep that version pinned exactly, since this job can push
      # tags and mint OIDC tokens. Drop the pin once the pinned Node ships npm 11.21.0 or later.
      # `npm view` reads the package document, which the registry's CDN caches for up to five
      # minutes, so it can name the old `latest` long after a move. The registry serves the
      # dist-tags endpoint uncached, so this step reads `latest` there, before and after the move.
      # A re-run for the version `latest` already names changes nothing.
      - name: Move latest
        run: |
          read_latest() {
            curl -fsS --retry 3 https://registry.npmjs.org/-/package/pomerado/dist-tags | jq -er .latest
          }
          previous="$(read_latest)"
          if [ "$previous" = "$VERSION" ]; then
            echo "latest already names $VERSION." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          npx --yes npm@11.21.0 dist-tag add "pomerado@$VERSION" latest
          # The registry accepted the move. Read it back, backing off for up to a minute in case a
          # replica behind the endpoint lags or a read fails.
          current="$(read_latest)" || current="(unreadable)"
          for delay in 2 4 8 16 30; do
            if [ "$current" = "$VERSION" ]; then
              break
            fi
            echo "latest still reads $current. Reading it again in ${delay}s."
            sleep "$delay"
            current="$(read_latest)" || current="(unreadable)"
          done
          if [ "$current" != "$VERSION" ]; then
            echo "::error::latest names $current, not $VERSION."
            exit 1
          fi
          echo "latest moved from $previous to $VERSION." >> "$GITHUB_STEP_SUMMARY"
      # Two tag rulesets cover v* tags. One lets only the release GitHub App create them, since
      # GitHub can't make GitHub Actions a bypass actor on a tag ruleset. The other lets no one move
      # or delete them, so a promotion after a rollback finds its tag and release already there. A
      # tag that is already there must point to the commit the provenance names. The app token is
      # scoped to this repository with contents: write, and only the tag step uses it.
      # docs/RELEASING.md describes the app and both rulesets.
      - name: Mint the release app token
        id: release-app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
      - name: Tag the commit and create the GitHub Release
        env:
          COMMIT: ${{ steps.published.outputs.commit }}
          GH_TOKEN: ${{ steps.release-app.outputs.token }}
        run: |
          tag="v$VERSION"
          if ref="$(gh api "repos/$REPOSITORY/git/ref/tags/$tag" 2>/dev/null)"; then
            type="$(jq -r .object.type <<<"$ref")"
            sha="$(jq -r .object.sha <<<"$ref")"
            # An annotated tag points to a tag object. Follow it to the commit.
            while [ "$type" = tag ]; do
              object="$(gh api "repos/$REPOSITORY/git/tags/$sha")"
              type="$(jq -r .object.type <<<"$object")"
              sha="$(jq -r .object.sha <<<"$object")"
            done
            if [ "$type" != commit ] || [ "$sha" != "$COMMIT" ]; then
              echo "::error::Tag $tag points to $type $sha, not to $COMMIT, the commit pomerado@$VERSION was built from."
              exit 1
            fi
          else
            if ! gh api "repos/$REPOSITORY/git/refs" -f ref="refs/tags/$tag" -f sha="$COMMIT" --silent; then
              echo "::error::Couldn't create tag $tag. If a tag ruleset refused it, check that the release GitHub App is installed on this repository with contents write access and may bypass the release tag creation ruleset, as docs/RELEASING.md describes."
              exit 1
            fi
          fi
          if ! gh release view "$tag" --repo "$REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$REPOSITORY" --verify-tag --title "pomerado $VERSION" --generate-notes
          fi
          gh release edit "$tag" --repo "$REPOSITORY" --latest
  # Posts to the maintainers' alerts channel when a canary or a promotion fails. The slack-alerts
  # environment deploys only from main and holds the incoming webhook and the on-call mention.
  # It holds a secret, so it runs on a GitHub-hosted runner, a fresh machine for every job.
  alert:
    needs: [version, check, canary, promote]
    if: failure() && github.repository == 'Pomerado/pomerado'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: slack-alerts
    steps:
      - name: Post the failure
        env:
          WEBHOOK: ${{ secrets.SLACK_ALERTS_WEBHOOK_URL }}
          MENTION: ${{ vars.SLACK_ONCALL_MENTION }}
          EVENT: ${{ github.event_name }}
          VERSION: ${{ inputs.version || needs.version.outputs.version }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          NEEDS: ${{ toJSON(needs) }}
        run: |
          # A dispatch input reaches Slack only as a valid version, so it can add no markup.
          if [ -n "$VERSION" ] && ! [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-canary\.(0|[1-9][0-9]*))?$ ]]; then
            VERSION="(an invalid version)"
          fi
          failed=$(jq -r '[to_entries[] | select(.value.result == "failure") | .key] | join(", ")' <<<"$NEEDS")
          if [ "$EVENT" = push ]; then
            what="pomerado canary ${VERSION:-(no version)} from ${SHA:0:12} failed"
          else
            what="promoting pomerado $VERSION to latest failed"
          fi
          text="${MENTION:+$MENTION }:rotating_light: $what at $failed. $RUN_URL"
          jq -n --arg text "$text" '{text: $text}' |
            curl -fsS --retry 3 -H 'Content-Type: application/json' --data @- "$WEBHOOK"
