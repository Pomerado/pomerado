name: Release
on:
  push:
    tags:
      - "v*"
permissions:
  contents: read
jobs:
  check:
    uses: ./.github/workflows/check.yml
  publish:
    needs: check
    if: github.repository == 'Pomerado/pomerado'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # No registry URL input, so setup-node writes no .npmrc token placeholder.
      # npm authenticates to the default registry through OIDC trusted publishing.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - name: Verify the tag matches package.json and is on main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match package.json version $version. Expected v$version."
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Tag $TAG points at $(git rev-parse HEAD), which is not on main."
            exit 1
          fi
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pomerado-package
          path: package-artifact
      - name: Verify the tested tarball
        id: tarball
        env:
          TAG: ${{ github.ref_name }}
        run: |
          shopt -s nullglob
          tarballs=(package-artifact/*.tgz)
          if [ "${#tarballs[@]}" -ne 1 ]; then
            echo "::error::Expected one tarball in package-artifact. Found ${#tarballs[@]}."
            exit 1
          fi
          # Keep the ./ prefix. npm reads dir/file.tgz as a GitHub owner/repo.
          tarball="./${tarballs[0]}"
          manifest="$(tar -xzOf "$tarball" package/package.json)"
          name="$(jq -r .name <<<"$manifest")"
          version="$(jq -r .version <<<"$manifest")"
          if [ "$name" != "pomerado" ] || [ "$TAG" != "v$version" ]; then
            echo "::error::Tarball holds $name@$version. Tag $TAG expects pomerado@${TAG#v}."
            exit 1
          fi
          echo "path=$tarball" >> "$GITHUB_OUTPUT"
      - name: Publish with npm trusted publishing and provenance
        env:
          TARBALL: ${{ steps.tarball.outputs.path }}
        run: npm publish "$TARBALL" --provenance --access public
